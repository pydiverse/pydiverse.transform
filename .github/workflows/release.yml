name: Release

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:

jobs:
  build:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          environments: release

      - name: Ensure tag matches version
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        run: |
          version="$(pixi exec -s go-yq -- yq .project.version pyproject.toml)"
          tag="${{ github.ref_name }}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match version $version"
            exit 1
          fi

      - name: Build
        run: pixi run -e release hatch build

      - name: Check build
        run: pixi run -e release twine check dist/*

      - name: Check install
        shell: pixi exec -s python==3.11.* -s pip -- bash -e {0}
        run: |
          pip install dist/*.whl
          python -c "from pydiverse.transform import *"
          pip check

      - name: List files
        run: ls -l dist/

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifact
          path: dist/*

  release:
    name: Publish Package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: pypi
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: artifact
          path: dist
      - name: Publish package on PyPi
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          # the twine version in the container is outdated
          # and results in a false positive
          verify-metadata: false
